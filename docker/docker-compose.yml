services:
  petbot_ws:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    image: ros2-mujoco-dev:latest
    container_name: petbot_ws

    volumes:
      - ~/:/workspace:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # X11 认证：挂 /run/user/<uid> 整个运行目录（tmpfs，登录后必存在，只读）。
      # 不挂单个 Xauthority 文件：挂载源不存在时 docker 会静默建成空目录，
      # 容器启动即报 not a directory；且单文件挂载钉死 inode，重登录后读不到新 cookie。
      - /run/user/${USER_UID:-1000}:/host-run:ro

    working_dir: /workspace/ros2_ws

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility, graphic, display]

    devices:
      - /dev/dri:/dev/dri
      - /dev/input:/dev/input

    network_mode: host
    privileged: true

    environment:
      - DISPLAY=${DISPLAY:-:1}
      - QT_X11_NO_MITSHM=1
      - QT_QPA_PLATFORM=xcb
      - XAUTHORITY=/host-run/gdm/Xauthority
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
      - MUJOCO_GL=egl
      - PYOPENGL_PLATFORM=egl
      - MUJOCO_VERSION=3.11.0
      - MUJOCO_PATH=/home/ros/mujoco
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp

    stdin_open: true
    tty: true
    command: ["sleep", "infinity"]
