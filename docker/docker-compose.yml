services:
  petbot_ws:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    image: ros2-mujoco-dev:latest
    container_name: petbot_ws

    # 宿主机 ~/ → 容器 /workspace
    volumes:
      - ~/:/workspace:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTH_PATH:-${HOME}/.Xauthority}:/tmp/.Xauthority:ro

    working_dir: /workspace/ros2_ws

    # NVIDIA GPU 直通
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility, graphic, display]

    # 显示 / 输入；串口与摄像头走 privileged 访问宿主机 /dev
    devices:
      - /dev/dri:/dev/dri
      - /dev/input:/dev/input

    # ROS2 节点发现需要 host 网络
    network_mode: host
    privileged: true

    environment:
      - DISPLAY=${DISPLAY:-:1}
      - QT_X11_NO_MITSHM=1
      - QT_QPA_PLATFORM=xcb
      - XAUTHORITY=/tmp/.Xauthority
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp

    stdin_open: true
    tty: true
    # 保持容器常驻；交互 shell 由 start.sh 的 docker exec 进入
    command: ["sleep", "infinity"]
