version: "3.9"

services:
  ros2-humble:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_UID: "1000"
        USER_GID: "1000"
    image: ros2-mujoco-dev:latest
    container_name: ros2-humble

    # 宿主 home 挂载为容器工作目录
    volumes:
      - ~/:/home/ros/host_home:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /run/user/1000/gdm/Xauthority:/tmp/.Xauthority:ro

    # NVIDIA GPU 直通
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility, graphic, display]

    # 外设直通
    devices:
      - /dev/dri:/dev/dri
      - /dev/ttyUSB0:/dev/ttyUSB0
      - /dev/ttyACM0:/dev/ttyACM0
      - /dev/video0:/dev/video0
      - /dev/input:/dev/input

    # ROS2 节点发现需要 host 网络
    network_mode: host
    privileged: true

    environment:
      - DISPLAY=${DISPLAY:-:1}
      - QT_X11_NO_MITSHM=1
      - QT_QPA_PLATFORM=xcb
      - XAUTHORITY=/tmp/.Xauthority
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp

    stdin_open: true
    tty: true
    command: /bin/bash
