# ToF 点云 → LaserScan（仅 mToF points，不用 RGB/IR）
tof_points_to_laserscan:
  ros__parameters:
    cloud_topic: /nebula280/mtof/points
    scan_topic: /scan
    target_frame: base_link
    min_height: -0.05
    max_height: 0.30
    range_min: 0.12
    range_max: 8.0
    angle_min: -1.5708
    angle_max: 1.5708
    angle_increment: 0.00872665   # 0.5 deg
    scan_time: 0.1
    use_inf: true
